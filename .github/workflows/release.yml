name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Required for SignPath trusted build verification
  actions: read      # Required for SignPath to read artifact & workflow info

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Mirror ci.yml: tests rely on local wall-clock semantics that the
      # codebase standardises on JST so date-based goal-history comparisons
      # match the developer-machine baseline.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies for native modules
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" || true
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          # Pin to windows-2022 (VS 2022 / v17): node-gyp 11 cannot yet
          # detect the VS 18 toolchain that windows-latest now ships.
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" || true
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-vite build

      # Windows: build WITHOUT code signing (SignPath will sign later)
      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # macOS: build with Apple code signing & notarization
      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then export CSC_LINK="$CSC_LINK_SECRET"; fi
          if [ -n "$CSC_KEY_PASSWORD_SECRET" ]; then export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"; fi
          if [ -n "$APPLE_ID_SECRET" ]; then export APPLE_ID="$APPLE_ID_SECRET"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"; fi
          if [ -n "$APPLE_TEAM_ID_SECRET" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"; fi
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.notarize=${{ secrets.APPLE_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}

      # Linux: build without code signing
      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage

  sign-windows:
    needs: build
    # Only run when SignPath is configured
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: artifact-win-x64
          path: unsigned

      - name: Upload unsigned exe for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: artifact-win-unsigned
          if-no-files-found: error
          path: unsigned/*.exe

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-win-signed
          if-no-files-found: error
          path: signed/*.exe

  release:
    needs: [build, sign-windows]
    # Run even if sign-windows was skipped (SignPath not yet configured)
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: artifact-*
          path: .
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            *.dmg
            *.exe
            *.AppImage
